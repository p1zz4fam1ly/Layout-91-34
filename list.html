<!DOCTYPE html>
<html>
<head>
    <title>Tugas List dan Icons Modul 2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f9f9f9;
        }

        h1 {
            color: #333;
        }

        .icon-section {
            margin-bottom: 25px;
        }

        .icon-section i {
            font-size: 35px;
            margin-right: 15px;
            color: #e91e63;
        }

        ol {
            background: #ffe5e5;
            padding: 20px 40px;
            border-radius: 8px;
        }

        ol li {
            background: #ffffff;
            color: darkred;
            padding: 8px;
            margin-bottom: 5px;
            border-radius: 4px;
        }

        ul {
            background: #cce5ff;
            padding: 20px 40px;
            border-radius: 8px;
            list-style-type: circle;
        }

        ul li {
            background: #ffffff;
            color: darkblue;
            padding: 8px;
            margin-bottom: 5px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1><i class="fas fa-utensils"></i> Tugas Icons & List HTML CSS</h1>

    <div class="icon-section">
        <h3>Font Awesome Icons Contoh:</h3>
        <i class="fas fa-heart"></i>
        <i class="fas fa-star"></i>
        <i class="fas fa-coffee"></i>
        <i class="fas fa-pizza-slice"></i>
        <i class="fas fa-smile"></i>
    </div>

    <h2>Daftar Makanan (Ordered List)</h2>
    <ol>
        <li>Nasi Goreng</li>
        <li>Ayam Penyet</li>
        <li>Ayam Geprek</li>
        <li>Kentang Goreng</li>
        <li>Kentang Balado</li>
    </ol>

    <h2>Daftar Minuman (Unordered List)</h2>
    <ul>
        <li>Es Jeruk</li>
        <li>Es Kelapa</li>
        <li>Teh Manis</li>
        <li>Air Mineral</li>
        <li>Es Coklat</li>
    </ul>

</body>
</html>







          <div class="Footer">
                <h2>Footer</h2>
            </div>
    </body>
</html>
