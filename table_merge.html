<!DOCTYPE html>
<html>
<head>
    <title>Table Merge Cell (Colspan & Rowspan)</title>
    <link rel="stylesheet" href="table_merge.css">
</head>
<body>

<h2>Tabel Penggabungan Sel (Rowspan & Colspan)</h2>

<table>
    <tr>
        <th rowspan="2">No.</th>
        <th rowspan="2">Nama Lengkap</th>
        <th colspan="2">Nilai Akademik</th>
    </tr>
    <tr>
        <th>Teori</th>
        <th>Praktik</th>
    </tr>
    <tr>
        <td>1</td>
        <td>Sophia Akari Suwendi</td>
        <td>95</td>
        <td>98</td>
    </tr>
    <tr>
        <td>2</td>
        <td>Clara Izumi</td>
        <td>88</td>
        <td>90</td>
    </tr>
    <tr>
        <td colspan="2" style="text-align: center; font-weight: bold;">Rata-rata</td>
        <td>91.5</td>
        <td>94</td>
    </tr>
</table>

</body>
</html>
