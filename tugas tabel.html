<!DOCTYPE html>
<html>
<head>
    <title>Tugas Layout Kotak Angka</title>
    <style>
        body {
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            grid-template-rows: repeat(12, 50px);
            gap: 4px; /* Garis merah sebagai jarak antar grid */
            background-color: red; /* Warna garis pembatas merah */
            padding: 4px;
            width: 700px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .box {
            background-color: blue; /* Warna biru standar */
            color: #adff2f; /* Warna teks hijau terang (yellowgreen) */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            font-family: Arial, sans-serif;
        }
        .cyan {
            background-color: #00ffff;
            color: #adff2f;
        }

        .b1  { grid-column: 1 / 4;  grid-row: 1 / 7; }
        .b2  { grid-column: 4 / 10; grid-row: 1 / 4; }
        .b3  { grid-column: 10 / 13; grid-row: 1 / 4; }
        .b4  { grid-column: 13 / 15; grid-row: 1 / 8; }
        .b5  { grid-column: 15 / 17; grid-row: 1 / 8; }
        .b6  { grid-column: 17 / 19; grid-row: 1 / 5; }
        .b7  { grid-column: 19 / 21; grid-row: 1 / 13; }
        
        .b8  { grid-column: 4 / 6;  grid-row: 4 / 7; }
        .b9  { grid-column: 6 / 8;  grid-row: 4 / 7; }
        .b10 { grid-column: 8 / 13; grid-row: 4 / 7; }
        
        .b11 { grid-column: 4 / 6;  grid-row: 7 / 10; }
        .b12 { grid-column: 6 / 8;  grid-row: 7 / 10; }
        .b13 { grid-column: 8 / 10; grid-row: 7 / 10; }
        .b14 { grid-column: 10 / 13; grid-row: 7 / 10; }
        
        .b15 { grid-column: 17 / 19; grid-row: 5 / 13; }
        .b16 { grid-column: 1 / 13; grid-row: 10 / 13; }
        
        .b17 { grid-column: 1 / 4;  grid-row: 13 / 19; }
        .b18 { grid-column: 4 / 8;  grid-row: 13 / 16; }
        .b19 { grid-column: 8 / 11; grid-row: 13 / 19; }
        .b20 { grid-column: 11 / 17; grid-row: 13 / 17; }
        
        .b21 { grid-column: 4 / 6;  grid-row: 16 / 19; }
        .b22 { grid-column: 6 / 8;  grid-row: 16 / 19; }
        .b23 { grid-column: 11 / 17; grid-row: 17 / 19; }
    </style>
</head>
<body>

    <div class="grid-container">
        <div class="box b1">1</div>
        <div class="box b2">2</div>
        <div class="box b3">3</div>
        <div class="box b4">4</div>
        <div class="box b5">5</div>
        <div class="box b6">6</div>
        <div class="box b7">7</div>
        <div class="box cyan b8">8</div>
        <div class="box cyan b9">9</div>
        <div class="box cyan b10">10</div>
        <div class="box b11">11</div>
        <div class="box b12">12</div>
        <div class="box b13">13</div>
        <div class="box b14">14</div>
        <div class="box b15">15</div>
        <div class="box cyan b16">16</div>
        <div class="box b17">17</div>
        <div class="box b18">18</div>
        <div class="box b19">19</div>
        <div class="box b20">20</div>
        <div class="box cyan b21">21</div>
        <div class="box cyan b22">22</div>
        <div class="box cyan b23">23</div>
    </div>

</body>
</html>
